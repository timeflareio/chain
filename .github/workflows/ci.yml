name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependabot's github-actions PRs touch only .github/workflows/**. Without a
  # job that always runs, they would merge with zero CI.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  proto:
    name: Protobuf (lint + breaking)
    runs-on: ubuntu-latest
    env:
      # 🚀 LAUNCH SWITCH: flip to 'true' at mainnet launch. Pre-launch,
      # protocol-breaking proto changes are permitted across the board, so
      # breaking detection reports a warning without failing the job. Once
      # 'true', wire compatibility against main becomes a hard CI gate.
      ENFORCE_PROTO_BREAKING: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so buf can diff against origin/main locally
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint protobuf definitions
        run: buf lint
      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          if [ "$ENFORCE_PROTO_BREAKING" = "true" ]; then
            buf breaking --against ".git#branch=origin/main"
          else
            buf breaking --against ".git#branch=origin/main" || \
              echo "::warning::Breaking proto changes detected against main — permitted pre-launch (ENFORCE_PROTO_BREAKING=false); this becomes a hard failure at launch"
          fi

  chain:
    name: Chain (verify + test)
    # Fail-fast: blocked by the seconds-fast checks so a lint failure never
    # burns the long test run.
    needs: [proto, workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint (prebuilt release binary)
        # make verify's fallback compiles golangci-lint from source via
        # `go install` — minutes on a cold cache. The pinned release binary
        # installs in seconds; keep the version in lockstep with
        # GOLANGCI_LINT_VERSION in make/go-quality.mk and .golangci.yml.
        # Downloaded directly with a pinned sha256: the upstream install.sh
        # mis-verifies v2 releases (its checksum grep also matches the new
        # .sbom.json assets by substring).
        run: |
          curl -sSfLO --retry 5 --retry-delay 2 --retry-all-errors \
            https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  golangci-lint-2.12.2-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf golangci-lint-2.12.2-linux-amd64.tar.gz
          install golangci-lint-2.12.2-linux-amd64/golangci-lint "$(go env GOPATH)/bin/"

      - name: Verify code quality
        # Step-level env overrides setup-go's GOTOOLCHAIN=local so that
        # `go install tool@latest` can fetch a newer toolchain for dev
        # tools (goimports/govulncheck) that now require go >= 1.25.
        env:
          GOTOOLCHAIN: auto
        run: make verify

      - name: Run unit tests
        run: make test

  # The full-stack gate. It runs the chain against the PINNED guardian release
  # rather than a local build, which is the only way to prove the components
  # still agree after the split — unit tests here cannot.
  #
  # EXPECTED TO FAIL until migration phase 4. The e2e harness is driven by the
  # TypeScript SDK's examples, and the SDK has no release to pin yet, so
  # sdk-sync has nothing to fetch. The job is present rather than deferred so
  # the gap is visible; it turns green when the SDK ships.
  e2e:
    name: E2E (devnet lifecycle) — pending SDK release
    needs: [chain, proto, workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the chain CLI
        env:
          GOTOOLCHAIN: auto
        run: make go-install
      - name: Fetch the pinned guardiand release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make guardiand-sync
      - name: Bring up the devnet
        # Blocks are 1s here: lifecycle waits are chain-distance in blocks, so
        # the 6s default would take the suite past 40 minutes.
        env:
          TIMEFLARE_BLOCK_TIME: 1s
        run: make dev-up
      - name: Run the lifecycle and scenario suites
        env:
          TIMEFLARE_BLOCK_TIME: 1s
          GH_TOKEN: ${{ github.token }}
        run: |
          make e2e
          make e2e-scenarios
      - name: Tear down
        if: always()
        run: make dev-down || true
