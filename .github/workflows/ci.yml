name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependabot's github-actions PRs touch only .github/workflows/**. Without a
  # job that always runs, they would merge with zero CI.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  proto:
    name: Protobuf (lint + breaking)
    runs-on: ubuntu-latest
    env:
      # 🚀 LAUNCH SWITCH: flip to 'true' at mainnet launch. Pre-launch,
      # protocol-breaking proto changes are permitted across the board, so
      # breaking detection reports a warning without failing the job. Once
      # 'true', wire compatibility against main becomes a hard CI gate.
      ENFORCE_PROTO_BREAKING: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so buf can diff against origin/main locally
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint protobuf definitions
        run: buf lint
      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          if [ "$ENFORCE_PROTO_BREAKING" = "true" ]; then
            buf breaking --against ".git#branch=origin/main"
          else
            buf breaking --against ".git#branch=origin/main" || \
              echo "::warning::Breaking proto changes detected against main — permitted pre-launch (ENFORCE_PROTO_BREAKING=false); this becomes a hard failure at launch"
          fi

  chain:
    name: Chain (verify + test)
    # Fail-fast: blocked by the seconds-fast checks so a lint failure never
    # burns the long test run.
    needs: [proto, workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint (prebuilt release binary)
        # make verify's fallback compiles golangci-lint from source via
        # `go install` — minutes on a cold cache. The pinned release binary
        # installs in seconds; keep the version in lockstep with
        # GOLANGCI_LINT_VERSION in make/go-quality.mk and .golangci.yml.
        # Downloaded directly with a pinned sha256: the upstream install.sh
        # mis-verifies v2 releases (its checksum grep also matches the new
        # .sbom.json assets by substring).
        run: |
          curl -sSfLO --retry 5 --retry-delay 2 --retry-all-errors \
            https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  golangci-lint-2.12.2-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf golangci-lint-2.12.2-linux-amd64.tar.gz
          install golangci-lint-2.12.2-linux-amd64/golangci-lint "$(go env GOPATH)/bin/"

      - name: Verify code quality
        # Step-level env overrides setup-go's GOTOOLCHAIN=local so that
        # `go install tool@latest` can fetch a newer toolchain for dev
        # tools (goimports/govulncheck) that now require go >= 1.25.
        env:
          GOTOOLCHAIN: auto
        run: make verify

      - name: Run unit tests
        run: make test

  # The full-stack gate. It runs the chain against the PINNED guardian release
  # rather than a local build, which is the only way to prove the components
  # still agree after the split — unit tests here cannot.
  #
  # CANNOT PASS YET, for two separate reasons, and it reports both rather than
  # dying at whichever it reaches first:
  #
  #   1. timeflareio/guardian is private, and Actions' default token is scoped
  #      to this repository, so the release assets are unreadable here. GitHub
  #      answers 404 for that, which reads as "no such release" and is why the
  #      first version of this job looked like a missing release.
  #   2. The e2e harness is driven by the TypeScript SDK's examples, and the SDK
  #      has no release to pin until migration phase 4.
  #
  # The job exists rather than being deferred so the gap stays visible. It turns
  # green when the guardian is readable and the SDK ships.
  e2e:
    name: E2E (devnet lifecycle)
    needs: [chain, proto, workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Report every blocker at once. A gate that fails at the first missing
      # prerequisite makes the second one invisible until the first is fixed.
      - name: Preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          blocked=0
          if gh repo view timeflareio/guardian >/dev/null 2>&1; then
            echo "✅ guardian releases are readable"
          else
            echo "❌ timeflareio/guardian is not readable from this repository."
            echo "   It is private, and the default token is scoped to this repo."
            echo "   Fix: make it public, or supply a read token as GH_TOKEN."
            blocked=1
          fi
          sdk_version="$(grep -E '^SDK_VERSION=' devnet/versions.env | cut -d= -f2)"
          if [ -n "${sdk_version}" ]; then
            echo "✅ SDK pinned at ${sdk_version}"
          else
            echo "❌ No SDK release to pin (SDK_VERSION empty in devnet/versions.env)."
            echo "   The TypeScript SDK is lifted in migration phase 4; until then the"
            echo "   e2e harness has no examples to run."
            blocked=1
          fi
          if [ "${blocked}" -ne 0 ]; then
            echo ""
            echo "::error::E2E is blocked on the prerequisites above. This is expected during the multi-repo migration and is tracked in the migration plan — it is not a regression in this pull request."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the chain CLI
        env:
          GOTOOLCHAIN: auto
        run: make go-install
      - name: Fetch the pinned guardiand release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make guardiand-sync
      - name: Bring up the devnet
        # Blocks are 1s here: lifecycle waits are chain-distance in blocks, so
        # the 6s default would take the suite past 40 minutes.
        env:
          TIMEFLARE_BLOCK_TIME: 1s
          GH_TOKEN: ${{ github.token }}
        run: make dev-up
      - name: Run the lifecycle and scenario suites
        env:
          TIMEFLARE_BLOCK_TIME: 1s
          GH_TOKEN: ${{ github.token }}
        run: |
          make e2e
          make e2e-scenarios

      # A failing devnet run is only diagnosable from the daemon logs, and the
      # runner destroys them. Every acceptance failure in this suite reads the
      # same from the suite's own output — a secret that did not reach a state —
      # so without these the first thing anyone does is re-run for twenty minutes
      # to learn what a log already recorded.
      #
      # Collected before teardown, which stops the processes. Best-effort
      # throughout: a missing log must never mask the real failure behind an
      # upload error.
      - name: Collect devnet logs
        if: failure()
        run: |
          set +e
          mkdir -p devnet-logs/guardians
          cp .devnet/chain.log devnet-logs/ 2>/dev/null
          for d in .devnet/guardians/*/; do
            [ -d "$d" ] || continue
            cp "$d/guardian.log" "devnet-logs/guardians/$(basename "$d").log" 2>/dev/null
          done
          # Which daemons were still alive at the moment of failure. A fleet that
          # silently loses a member is a known failure mode here, and the pid
          # files answer it after the fact.
          for d in .devnet/guardians/*/; do
            [ -f "$d/guardian.pid" ] || continue
            pid=$(cat "$d/guardian.pid")
            if kill -0 "$pid" 2>/dev/null; then state=running; else state=NOT-RUNNING; fi
            echo "$(basename "$d") pid=$pid $state"
          done | tee devnet-logs/fleet-state.txt
          exit 0
      - name: Upload devnet logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-logs
          path: devnet-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: make dev-down || true
