syntax = "proto3";

package timeflare.secrets.module.v1;

option go_package = "github.com/timeflareio/chain/x/secrets/types";

import "cosmos/app/v1alpha1/module.proto";

// Module is the config object of the secrets module.
message Module {
  option (cosmos.app.v1alpha1.module) = {
    go_import: "github.com/timeflareio/chain/x/secrets"
  };
}