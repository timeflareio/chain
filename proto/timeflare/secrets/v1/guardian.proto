syntax = "proto3";

package timeflare.secrets.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/timeflareio/chain/x/secrets/types";

// Guardian defines a registered guardian node.
//
// Economics: guardians maintain a deposited float of VEIL. `stake` is the float
// TOTAL held in module escrow; `locked_stake` is the portion currently locked as
// per-secret bonds. unlocked = stake - locked_stake; withdrawals are capped at
// unlocked. See docs/spec.md "Secret Economics & Slashing".
message Guardian {
  string address = 1;
  bytes encryption_public_key = 2;         // Secret share encryption key (32 bytes)
  int64 available_from = 3;                // Absolute block height when guardian starts accepting assignments
  int64 available_until = 4;               // Absolute block height when guardian stops accepting assignments
  cosmos.base.v1beta1.Coin stake = 5 [(gogoproto.nullable) = true];        // Float total (deposited working capital)
  bool accepting_secrets = 6;              // true = accept new assignments, false = finish existing only
  cosmos.base.v1beta1.Coin locked_stake = 7 [(gogoproto.nullable) = true]; // Portion of the float locked as per-secret bonds
  // Live bond multiplier k in hundredths (shares BumpScale): prices this
  // guardian's bonds, B = rate × distance × bump × k. Starts at the floor
  // (400 = 4.00); × 1.26 per slash, × 0.963 per correct reveal, truncating,
  // clamped to [400, 2400]. See docs/spec.md "The Per-Guardian Bond Multiplier k".
  int64 bond_k = 8;
  // Denormalised count of currently locked per-secret bonds — the concurrency
  // cap gate (100): at the cap the guardian is not a selection candidate and
  // cannot lock further bonds. Asserted against the assignment store by the
  // invariant suite.
  int64 active_bond_count = 9;
  // Current key epoch: 0 at registration, +1 per MsgGuardianRotateKey. The
  // encryption_public_key above is the current epoch's key (the O(1)
  // selection read); the full append-only history lives in the
  // GuardianKeyHistory store as (address, epoch) → KeyHistoryEntry.
  uint64 current_key_epoch = 10;
}

// KeyHistoryEntry is one epoch of a guardian's append-only key history.
// No entry is ever overwritten or deleted, and every key ever registered
// stays globally reserved forever — share material encrypted to it may
// still exist. See docs/spec.md "Guardian Key Rotation".
message KeyHistoryEntry {
  bytes public_key = 1;              // The epoch's encryption public key (32 bytes)
  // Height this epoch took effect: registration/rotation height + 1. The
  // epoch in force for a guardian at height h is the newest entry with
  // effective_from_height <= h — a pure function of the history, never
  // stored per-secret.
  int64 effective_from_height = 2;
}
// GuardianEligibility is the selection filter's projection of a guardian,
// stored as the VALUE of the eligibility index (key: available_until, guardian
// address). It carries every field the per-secret filter needs so a candidate
// can be judged WITHOUT reading its full Guardian record.
//
// That is the whole point of the index. Reading the record per candidate would
// cost ~1,750 gas against ~336 for an index entry, and phase-1 candidate
// enumeration is metered inside the creator's transaction — an index that still
// read records would have to exclude ~68% of registrations merely to break even
// against walking the collection once.
//
// The denom is implied (DefaultDenom, as everywhere else in the module), so only
// the unlocked amount is stored. Every field is a projection of the record:
// GuardianEligibilityOf is the single place it is derived, SetGuardian the
// single place it is written.
message GuardianEligibility {
  // Absolute block height when the guardian starts accepting assignments. The
  // upper bound (available_until) is the index KEY, not a value field.
  int64 available_from = 1;
  // Concurrency-cap gate: at MaxActiveBondsPerGuardian the guardian is not a
  // candidate until an existing secret settles.
  int64 active_bond_count = 2;
  // Live bond multiplier k in hundredths — prices THIS candidate's bond for the
  // secret being created, B = rate × distance × bump × k.
  int64 bond_k = 3;
  // Float not currently locked as bonds (stake - locked_stake), the
  // affordability test's left-hand side. Derived, so it must be rewritten
  // whenever either component moves — which is why the index is maintained at
  // SetGuardian rather than at the call sites.
  cosmos.base.v1beta1.Coin unlocked = 4 [(gogoproto.nullable) = false];
}
