syntax = "proto3";

package timeflare.secrets.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/wrappers.proto";
import "timeflare/secrets/v1/secret.proto";

option go_package = "github.com/timeflareio/chain/x/secrets/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UserRequestGuardians defines Phase 1 of the three-phase commit protocol
  rpc UserRequestGuardians(MsgUserRequestGuardians) returns (MsgUserRequestGuardiansResponse);

  // UserDistributeShares defines Phase 2 of the three-phase commit protocol
  rpc UserDistributeShares(MsgUserDistributeShares) returns (MsgUserDistributeSharesResponse);

  // GuardianConfirmShares defines Phase 3 of the three-phase commit protocol
  rpc GuardianConfirmShares(MsgGuardianConfirmShares) returns (MsgGuardianConfirmSharesResponse);

  // UserCancelSecret defines the UserCancelSecret RPC.
  rpc UserCancelSecret(MsgUserCancelSecret) returns (MsgUserCancelSecretResponse);

  // GuardianRevealShare defines the GuardianRevealShare RPC for guardians to submit shares.
  rpc GuardianRevealShare(MsgGuardianRevealShare) returns (MsgGuardianRevealShareResponse);

  // GuardianRegister defines the GuardianRegister RPC.
  rpc GuardianRegister(MsgGuardianRegister) returns (MsgGuardianRegisterResponse);

  // GuardianUpdate defines the GuardianUpdate RPC.
  rpc GuardianUpdate(MsgGuardianUpdate) returns (MsgGuardianUpdateResponse);

  // GuardianRotateKey rotates the guardian's share-encryption key forward
  // for future assignments (appends the next key epoch).
  rpc GuardianRotateKey(MsgGuardianRotateKey) returns (MsgGuardianRotateKeyResponse);

  // SlashGuardian defines the SlashGuardian RPC.
  rpc SlashGuardian(MsgSlashGuardian) returns (MsgSlashGuardianResponse);

  // GuardianWithdrawStake defines the GuardianWithdrawStake RPC.
  rpc GuardianWithdrawStake(MsgGuardianWithdrawStake) returns (MsgGuardianWithdrawStakeResponse);

  // RecipientCommitRebate publishes the commitment that binds a recipiency
  // proof to the address collecting with it (step 1 of 2).
  rpc RecipientCommitRebate(MsgRecipientCommitRebate) returns (MsgRecipientCommitRebateResponse);

  // RecipientCollectRebate reveals the recipiency proof and pays the rebate to
  // the address that committed to it in an earlier block (step 2 of 2).
  rpc RecipientCollectRebate(MsgRecipientCollectRebate) returns (MsgRecipientCollectRebateResponse);
}

// MsgUserRequestGuardians defines Phase 1 of the three-phase commit protocol.
// The reward pool is NOT chosen by the creator: it is derived by protocol formula
// P = (max_shares × F_reveal) + (rate × distance × max_shares × bump) and
// escrowed from the creator's account at publication, alongside the separately
// escrowed accept fees A = max_shares × F_accept. See docs/spec.md
// "Secret Economics & Slashing".
// The secret ID is protocol-assigned (derived from a monotonic counter) and
// guardian selection is fully protocol-controlled (hash sortition seeded from
// consensus data) — the creator supplies no selection input of any kind.
message MsgUserRequestGuardians {
  option (cosmos.msg.v1.signer) = "creator";
  // Retired: the single requested share count, replaced by the
  // [min_shares, max_shares] band. The number stays reserved so old wire
  // data can never be misread.
  reserved 5;
  reserved "shares";
  // Retired: the creator-chosen commit timeout, replaced by the protocol
  // constant CommitTimeoutBlocks. The number stays reserved so old wire data
  // can never be misread.
  reserved 7;
  reserved "commit_timeout";
  string creator = 1;
  DetectionHint detection_hint = 2 [(gogoproto.nullable) = false]; // Recipient discovery hint (see secret.proto); random bytes = no discovery
  RevealWindow reveal_window = 3;
  int64 threshold = 4;                     // Minimum shares needed for reconstruction (2-16)
  int64 bump = 6;                          // Security factor in hundredths (100-1000 = 1.00-10.00); scales reward pool and guardian bonds together
  int64 min_shares = 8;                    // Band floor: minimum acceptances for the secret to proceed (threshold ≤ min_shares)
  int64 max_shares = 9;                    // Band ceiling: guardians selected and shares distributed (min_shares ≤ max_shares ≤ 32, max − min < threshold)
}

// GuardianInfo contains the information clients need to encrypt shares
message GuardianInfo {
  string address = 1;                      // Guardian's account address
  bytes public_key = 2;                    // Guardian's encryption public key (32 bytes)
}

// MsgUserRequestGuardiansResponse returns the guardian assignments for Phase 2.
message MsgUserRequestGuardiansResponse {
  string secret_id = 1;                    // Protocol-assigned secret ID (UUIDv5 over chainID ‖ counter)
  repeated GuardianInfo guardian_assignments = 2; // Guardian info for client encryption
}

// EncryptedShareData contains the encrypted share and verification data
message EncryptedShareData {
  string guardian_address = 1;             // Must match assignment
  bytes encrypted_share = 2;               // SSS share data encrypted with guardian's public key (contains intrinsic SSS ID)
  bytes share_hmac = 3;                    // HMAC for slashing detection
}

// MsgUserDistributeShares defines Phase 2 of the three-phase commit protocol
// (key-share architecture: the payload ciphertext is stored once and the
// shares are ~94B encrypted key-share envelopes, not payload fragments).
message MsgUserDistributeShares {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string secret_id = 2;                    // From Phase 1 response
  repeated EncryptedShareData shares = 3;  // Encrypted key shares, one per guardian
  bytes secret_commitment = 4;             // SHA256 of the recipient-encrypted payload (C_r) for reconstruction verification
  // C — the recipient-encrypted payload, encrypted once more to the
  // per-secret public key. Stored on chain exactly once (≤ MaxPayloadSize).
  bytes payload_ciphertext = 5;
  // pk_s — the per-secret public key (32B). Stored on the secret record so a
  // reconstructed private key is publicly checkable (fault attribution).
  bytes secret_public_key = 6;
}

// MsgUserDistributeSharesResponse confirms successful share distribution.
message MsgUserDistributeSharesResponse {}


// MsgUserCancelSecret defines the MsgUserCancelSecret message.
message MsgUserCancelSecret {
  option (cosmos.msg.v1.signer) = "creator";
  string secret_id = 1;
  string creator = 2;
}

// MsgUserCancelSecretResponse defines the MsgUserCancelSecretResponse message.
message MsgUserCancelSecretResponse {}


// MsgGuardianRevealShare defines the MsgGuardianRevealShare message for guardians to submit shares.
message MsgGuardianRevealShare {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;
  string secret_id = 2;
  bytes decrypted_share = 3;               // SSS share data with intrinsic SSS ID
}

// MsgGuardianRevealShareResponse defines the MsgGuardianRevealShareResponse message.
message MsgGuardianRevealShareResponse {
  // Whether the share was accepted and verified
  bool accepted = 1;
  // Whether this submission triggered successful reconstruction
  bool reconstruction_complete = 2;
}

// MsgGuardianConfirmShares defines Phase 3 of the three-phase commit protocol
message MsgGuardianConfirmShares {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;        // Guardian accepting or rejecting
  string secret_id = 2;       // Target secret
  bool accept = 3;            // true=accept, false=reject
}

// MsgGuardianConfirmSharesResponse confirms guardian acceptance decision
message MsgGuardianConfirmSharesResponse {
  // Retired: nothing activates mid-window under the [min, max] band — the
  // roster finalises at the commit deadline. Number reserved so old wire
  // data can never be misread.
  reserved 1;
  reserved "secret_activated";
  // Whether the secret is now locked in (accepted_count ≥ min_shares —
  // guaranteed to finalise to pending at the deadline). Informational: the
  // same fact is inferable from any Secret query; there is no event.
  bool locked_in = 2;
}

// MsgGuardianRegister defines the MsgGuardianRegister message for new guardian registration only.
// Registration charges the protocol entry fee (burned) from the guardian's account in
// addition to any initial float deposit.
message MsgGuardianRegister {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;                     // Guardian address (also the signer)
  bytes encryption_public_key = 2;         // Secret share encryption key (32 bytes)
  int64 available_from = 3;                // Relative blocks from current when guardian starts accepting (0 = current_block + 1)
  int64 available_until = 4;               // Relative blocks from available_from when guardian stops accepting (minimum 100 blocks)
  cosmos.base.v1beta1.Coin deposit = 5 [(amino.dont_omitempty) = true]; // Initial float deposit (may be zero; entry fee charged separately and burned)
  bool accepting_secrets = 6;              // true = accept new assignments, false = finish existing only
}

// MsgGuardianRegisterResponse defines the MsgGuardianRegisterResponse message.
message MsgGuardianRegisterResponse {}

// MsgGuardianUpdate defines the MsgGuardianUpdate message for updating existing guardian parameters.
// Note: Encryption keys are permanently immutable and cannot be updated.
message MsgGuardianUpdate {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;                     // Guardian address (also the signer)
  int64 available_from = 2;                // Optional: Relative blocks from current when guardian starts accepting (0 = current_block + 1)
  int64 available_until = 3;               // Optional: Relative blocks from available_from when guardian stops accepting (minimum 100 blocks)
  cosmos.base.v1beta1.Coin deposit = 4;    // Optional: Additional VEIL deposited into the float
  google.protobuf.BoolValue accepting_secrets = 5; // Presence-aware: omitted = no change; explicit true/false = set
}

// MsgGuardianUpdateResponse defines the MsgGuardianUpdateResponse message.
message MsgGuardianUpdateResponse {}

// MsgGuardianRotateKey rotates the guardian's share-encryption key forward:
// the new key becomes the next epoch of the append-only key history and takes
// effect for selections from the next block; every existing assignment stays
// bound to the epoch key it was created under. Charges a flat burned rotation
// fee (rate × 14,400) and is rate-limited to one rotation per guardian per
// 432,000 blocks. NOT a loss-recovery mechanism — the chain can re-encrypt
// nothing. See docs/spec.md "Guardian Key Rotation".
message MsgGuardianRotateKey {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;                     // Guardian address (also the signer)
  bytes new_key = 2;                       // Next epoch's encryption public key (32 bytes, globally unique forever)
}

// MsgGuardianRotateKeyResponse reports the epoch the rotation created.
message MsgGuardianRotateKeyResponse {
  uint64 new_epoch = 1;                    // The epoch the new key occupies
  int64 effective_from_height = 2;         // Height the new key takes effect (rotation height + 1)
}

// MsgSlashGuardian defines the MsgSlashGuardian message for reporting early reveals.
// No reveal slashing is handled automatically on-chain when reveal windows close.
message MsgSlashGuardian {
  option (cosmos.msg.v1.signer) = "reporter_address";
  string guardian_address = 1;  // Guardian being reported for early reveal
  bytes evidence = 2;           // Share data that was revealed early (min 32 bytes)
  string reporter_address = 3;  // Reporter's wallet address (receives reward on successful slash)
  string reason = 4;            // Human-readable reason for the slash
  string secret_id = 5;         // Secret this evidence relates to
}

// MsgSlashGuardianResponse defines the MsgSlashGuardianResponse message.
message MsgSlashGuardianResponse {}

// MsgGuardianWithdrawStake defines the MsgGuardianWithdrawStake message for guardians to withdraw
// their unlocked float. Bonds for in-flight secrets remain locked; the guardian
// record persists (registration is permanent — the entry fee is burned).
message MsgGuardianWithdrawStake {
  option (cosmos.msg.v1.signer) = "guardian";
  string guardian = 1;
}

// MsgGuardianWithdrawStakeResponse defines the MsgGuardianWithdrawStakeResponse message.
message MsgGuardianWithdrawStakeResponse {}

// MsgRecipientCommitRebate is step 1 of collecting a rebate: it publishes
// SHA256("timeflare/rebate-commit/v1" || z || collector address) without
// revealing `z`, binding the proof to this signer before the proof is public.
//
// Committing is what makes the reveal safe. `z` becomes public in step 2, and a
// rebate paid to whoever presents `z` could otherwise be front-run by any
// observer; a front-runner cannot produce a commitment for a proof it has not
// seen, and cannot backdate one, so only the address that committed first can
// collect.
message MsgRecipientCommitRebate {
  option (cosmos.msg.v1.signer) = "recipient";
  // Address that will collect the rebate; the commitment binds to it
  string recipient = 1;
  // Secret whose rebate is being committed to
  string secret_id = 2;
  // SHA256(domain || z || recipient address bytes), exactly 32 bytes
  bytes commitment = 3;
}

// MsgRecipientCommitRebateResponse returns the height the commitment was
// recorded at; the reveal must land strictly later.
message MsgRecipientCommitRebateResponse {
  int64 committed_at = 1;
}

// MsgRecipientCollectRebate is step 2: it reveals the recipiency proof and
// pays the credited rebate to the SIGNER, which must be the address that
// committed to this proof in an earlier block.
//
// Recipiency is proved by `z`, the X25519 shared value the recipient's private
// key computes against the hint's stored ephemeral key R. The chain accepts the
// message only when SHA256("timeflare/detect/v1" || z)[:8] equals the secret's
// stored hint tag AND `z` reproduces the signer's commitment.
//
// WARNING: `z` is public and permanent once submitted. It links the collecting
// address to this secret, and an address collecting several secrets links those
// secrets to one another — a deliberate, opt-in exception to recipient privacy.
message MsgRecipientCollectRebate {
  option (cosmos.msg.v1.signer) = "recipient";
  // Address collecting the rebate; the rebate is paid here
  string recipient = 1;
  // Secret whose rebate is being collected
  string secret_id = 2;
  // z = X25519(a, R) — the shared value only the recipient's private key can
  // compute for this secret's hint. Exactly 32 bytes.
  bytes z = 3;
}

// MsgRecipientCollectRebateResponse returns the amount paid.
message MsgRecipientCollectRebateResponse {
  // Rebate paid to the recipient, in uveil
  string amount = 1;
}
