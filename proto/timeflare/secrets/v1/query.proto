syntax = "proto3";

package timeflare.secrets.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "timeflare/secrets/v1/secret.proto";
import "timeflare/secrets/v1/guardian.proto";

option go_package = "github.com/timeflareio/chain/x/secrets/types";

// Query defines the gRPC querier service.
service Query {
  // Secret queries a secret by ID, assembled with its guardian assignments
  // and revealed shares (the full pre-split wire shape).
  rpc Secret(QuerySecretRequest) returns (QuerySecretResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}";
  }

  // Secrets queries all secrets (assembled views) with pagination.
  rpc Secrets(QuerySecretsRequest) returns (QuerySecretsResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secrets";
  }

  // SecretsByCreator queries secrets by creator address (assembled views).
  rpc SecretsByCreator(QuerySecretsByCreatorRequest) returns (QuerySecretsByCreatorResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secrets/creator/{creator}";
  }

  // PendingSecrets queries secrets in their active reveal phase
  // (pending/reconstructable), as assembled views.
  rpc PendingSecrets(QueryPendingSecretsRequest) returns (QueryPendingSecretsResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secrets/pending";
  }

  // SecretMeta queries only the slim secret metadata record — no share or
  // reveal data. The cheap call for light clients.
  rpc SecretMeta(QuerySecretMetaRequest) returns (QuerySecretMetaResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/meta";
  }

  // SecretAssignments queries the per-guardian assignment status records for
  // a secret (tiny; no share bytes).
  rpc SecretAssignments(QuerySecretAssignmentsRequest) returns (QuerySecretAssignmentsResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/assignments";
  }

  // SecretReveals queries the revealed shares for a secret (what a recipient
  // needs to reconstruct).
  rpc SecretReveals(QuerySecretRevealsRequest) returns (QuerySecretRevealsResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/reveals";
  }

  // SecretShare queries a single guardian's encrypted share for a secret —
  // what a guardian daemon needs, without the other guardians' shares.
  rpc SecretShare(QuerySecretShareRequest) returns (QuerySecretShareResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/share/{guardian_address}";
  }

  // SecretPayload queries a secret's stored payload ciphertext (C) — what a
  // reconstruction client needs alongside the revealed key shares.
  rpc SecretPayload(QuerySecretPayloadRequest) returns (QuerySecretPayloadResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/payload";
  }

  // HintsSince returns compact (secret_id, detection_hint) tuples for secrets
  // created at or after the given height, in creation order — the incremental
  // discovery-scan cursor. Recipients poll this, test each hint against their
  // private key client-side, and resume from their last scanned height.
  // A pruned secret's hint is deleted at Stage 2 (retention): discovery is
  // bounded by the retention window by design — scan at least every six months.
  rpc HintsSince(QueryHintsSinceRequest) returns (QueryHintsSinceResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/hints/{since_height}";
  }

  // SecretTombstone returns the permanent tombstone of a pruned secret —
  // distinguishing "pruned" (archived, digest-verifiable) from "never
  // existed" (NotFound on both this and Query/Secret).
  rpc SecretTombstone(QuerySecretTombstoneRequest) returns (QuerySecretTombstoneResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/secret/{secret_id}/tombstone";
  }

  // Guardian queries a guardian by address.
  rpc Guardian(QueryGuardianRequest) returns (QueryGuardianResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/guardian/{address}";
  }

  // Guardians queries all guardians with pagination.
  rpc Guardians(QueryGuardiansRequest) returns (QueryGuardiansResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/guardians";
  }

  // GuardianKeyHistory queries a guardian's append-only key-epoch history in
  // epoch order — what a daemon or client needs to resolve the epoch in
  // force at any height (newest entry with effective_from_height <= h).
  rpc GuardianKeyHistory(QueryGuardianKeyHistoryRequest) returns (QueryGuardianKeyHistoryResponse) {
    option (google.api.http).get = "/timeflare/secrets/v1/guardian/{address}/key-history";
  }
}

// SecretView is the assembled query shape: the slim stored Secret joined with
// its side-stores (assignments, reveals). Field numbers 1-20 deliberately
// match the pre-split Secret message so existing clients decode responses
// unchanged; field 9 (guardian_selection) is retired — selection inputs are
// no longer stored (see the reservation event and tx history).
message SecretView {
  reserved 9;
  reserved "guardian_selection";
  // Retired: the buffered total (8) and the pre-buffer requested count (18),
  // replaced by the [min_shares, max_shares] band (27, 28).
  reserved 8, 18;
  reserved "shares", "requested_shares";

  string id = 1;
  string creator = 2;
  DetectionHint detection_hint = 3 [(gogoproto.nullable) = false];
  int64 reveal_start_block = 5;
  int64 reveal_end_block = 6;
  int64 threshold = 7;
  bytes secret_commitment = 10;
  int64 commit_deadline = 11;
  string state = 12;
  // Assembled from the SecretShareData + AssignmentRecord side-stores
  repeated GuardianAssignment guardian_assignments = 13;
  // The accepted (= active) guardian addresses
  repeated string active_assignments = 14;
  repeated RevealedShare revealed_shares = 15;
  cosmos.base.v1beta1.Coin reward_pool = 16 [(gogoproto.nullable) = false];
  // The acceptance reimbursement escrowed apart from the pool
  // (A = max_shares × F_accept), settled at the secret's terminal state to
  // the guardians that did the job asked of them
  cosmos.base.v1beta1.Coin accept_fees = 29 [(gogoproto.nullable) = false];
  int64 created_at = 17;
  int64 bump = 19;
  reserved 20;
  reserved "bond_amount";
  repeated string selected_guardians = 21;
  int64 accepted_count = 22;
  int64 revealed_count = 23;
  int64 terminal_at = 24;
  // pk_s — joins the view additively; the payload ciphertext itself is served
  // only by the granular SecretPayload endpoint
  bytes secret_public_key = 25;
  // Per-guardian bond amounts in uveil, aligned with selected_guardians
  // (frozen at selection — see Secret.guardian_bond_amounts)
  repeated int64 guardian_bond_amounts = 26;
  // Band floor (threshold ≤ min_shares) — see Secret.min_shares
  int64 min_shares = 27;
  // Band ceiling (min ≤ max ≤ 32, max − min < threshold) — see Secret.max_shares
  int64 max_shares = 28;
  // Rebate credited to this secret's recipient at settlement, in uveil, and
  // reserved in the keyless rebate pool until collected. Zero means none was
  // credited: the secret did not reach `revealed`, or its share fell below the
  // dust floor. See docs/spec.md "Recipient Rebate".
  int64 rebate_amount = 30;
  // True once the rebate has been collected. A positive amount that is not yet
  // collected is the only collectable condition.
  bool rebate_collected = 31;
}

// SecretAssignmentView is one guardian's assignment status (no share bytes).
message SecretAssignmentView {
  string guardian_address = 1;
  AssignmentStatus status = 2;
  int64 responded_at_block = 3;
  // Whether an encrypted share was distributed to this guardian
  bool has_share = 4;
}

// QuerySecretRequest is the request type for the Query/Secret RPC method.
message QuerySecretRequest {
  string secret_id = 1;
}

// QuerySecretResponse is the response type for the Query/Secret RPC method.
message QuerySecretResponse {
  SecretView secret = 1;
}

// QuerySecretsRequest is the request type for the Query/Secrets RPC method.
message QuerySecretsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QuerySecretsResponse is the response type for the Query/Secrets RPC method.
message QuerySecretsResponse {
  repeated SecretView secrets = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QuerySecretsByCreatorRequest is the request type for the Query/SecretsByCreator RPC method.
message QuerySecretsByCreatorRequest {
  string creator = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QuerySecretsByCreatorResponse is the response type for the Query/SecretsByCreator RPC method.
message QuerySecretsByCreatorResponse {
  repeated SecretView secrets = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPendingSecretsRequest is the request type for the Query/PendingSecrets RPC method.
message QueryPendingSecretsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryPendingSecretsResponse is the response type for the Query/PendingSecrets RPC method.
message QueryPendingSecretsResponse {
  repeated SecretView secrets = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QuerySecretMetaRequest is the request type for the Query/SecretMeta RPC method.
message QuerySecretMetaRequest {
  string secret_id = 1;
}

// QuerySecretMetaResponse is the response type for the Query/SecretMeta RPC method.
message QuerySecretMetaResponse {
  Secret secret = 1;
}

// QuerySecretAssignmentsRequest is the request type for the Query/SecretAssignments RPC method.
message QuerySecretAssignmentsRequest {
  string secret_id = 1;
}

// QuerySecretAssignmentsResponse is the response type for the Query/SecretAssignments RPC method.
message QuerySecretAssignmentsResponse {
  repeated SecretAssignmentView assignments = 1 [(gogoproto.nullable) = false];
}

// QuerySecretRevealsRequest is the request type for the Query/SecretReveals RPC method.
message QuerySecretRevealsRequest {
  string secret_id = 1;
}

// QuerySecretRevealsResponse is the response type for the Query/SecretReveals RPC method.
message QuerySecretRevealsResponse {
  repeated RevealedShare reveals = 1;
}

// QuerySecretShareRequest is the request type for the Query/SecretShare RPC method.
message QuerySecretShareRequest {
  string secret_id = 1;
  string guardian_address = 2;
}

// QuerySecretShareResponse is the response type for the Query/SecretShare RPC method.
message QuerySecretShareResponse {
  SecretShareData share = 1;
}

// QuerySecretPayloadRequest is the request type for the Query/SecretPayload RPC method.
message QuerySecretPayloadRequest {
  string secret_id = 1;
}

// QuerySecretPayloadResponse is the response type for the Query/SecretPayload RPC method.
message QuerySecretPayloadResponse {
  // The payload ciphertext C (outer-encrypted to the per-secret key)
  bytes payload_ciphertext = 1;
}

// QuerySecretTombstoneRequest is the request type for the Query/SecretTombstone RPC method.
message QuerySecretTombstoneRequest {
  string secret_id = 1;
}

// QuerySecretTombstoneResponse is the response type for the Query/SecretTombstone RPC method.
message QuerySecretTombstoneResponse {
  SecretTombstone tombstone = 1 [(gogoproto.nullable) = false];
}

// QueryHintsSinceRequest is the request type for the Query/HintsSince RPC
// method. since_height is inclusive; pagination applies within the range.
message QueryHintsSinceRequest {
  int64 since_height = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// HintRecord is one compact discovery-scan entry (~50B).
message HintRecord {
  string secret_id = 1;
  int64 created_at = 2;
  DetectionHint detection_hint = 3 [(gogoproto.nullable) = false];
}

// QueryHintsSinceResponse is the response type for the Query/HintsSince RPC
// method. Records are returned in (created_at, secret_id) order so clients
// can persist the last created_at as their resume cursor.
message QueryHintsSinceResponse {
  repeated HintRecord hints = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGuardianRequest is request type for the Query/Guardian RPC method.
message QueryGuardianRequest {
  string address = 1;
}

// QueryGuardianResponse is response type for the Query/Guardian RPC method.
message QueryGuardianResponse {
  Guardian guardian = 1 [(gogoproto.nullable) = false];
}

// QueryGuardiansRequest is request type for the Query/Guardians RPC method.
message QueryGuardiansRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryGuardiansResponse is response type for the Query/Guardians RPC method.
message QueryGuardiansResponse {
  repeated Guardian guardians = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// GuardianKeyEpoch is one entry of a guardian's key history, with its epoch
// number made explicit for clients.
message GuardianKeyEpoch {
  uint64 epoch = 1;
  KeyHistoryEntry entry = 2 [(gogoproto.nullable) = false];
}

// QueryGuardianKeyHistoryRequest is request type for the
// Query/GuardianKeyHistory RPC method.
message QueryGuardianKeyHistoryRequest {
  string address = 1;
}

// QueryGuardianKeyHistoryResponse is response type for the
// Query/GuardianKeyHistory RPC method. Entries are returned in epoch order
// (epoch 0 = the registration key); histories are small by construction
// (the rotation interval bounds growth to ~12 entries per guardian-year),
// so the response is unpaginated.
message QueryGuardianKeyHistoryResponse {
  repeated GuardianKeyEpoch epochs = 1 [(gogoproto.nullable) = false];
}
