syntax = "proto3";

package timeflare.secrets.v1;

import "gogoproto/gogo.proto";
import "timeflare/secrets/v1/secret.proto";
import "timeflare/secrets/v1/guardian.proto";

option go_package = "github.com/timeflareio/chain/x/secrets/types";

// StoredShare is a genesis entry for one guardian's encrypted share record.
message StoredShare {
  string secret_id = 1;
  string guardian_address = 2;
  SecretShareData data = 3 [(gogoproto.nullable) = false];
}

// StoredAssignment is a genesis entry for one guardian's assignment status record.
message StoredAssignment {
  string secret_id = 1;
  string guardian_address = 2;
  AssignmentRecord record = 3 [(gogoproto.nullable) = false];
}

// StoredReveal is a genesis entry for one revealed share (the guardian
// address is carried inside the RevealedShare).
message StoredReveal {
  string secret_id = 1;
  RevealedShare reveal = 2 [(gogoproto.nullable) = false];
}

// EarlyRevealSlashEntry marks a guardian slashed for an early reveal on a
// secret — required at settlement to exclude the guardian from payouts, so it
// is genuine state, not derivable.
message EarlyRevealSlashEntry {
  string secret_id = 1;
  string guardian_address = 2;
}

// StoredPayload is a genesis entry for one secret's payload ciphertext.
message StoredPayload {
  string secret_id = 1;
  bytes payload_ciphertext = 2;
}

// GenesisState defines the secrets module's genesis state. The due-height
// queues and the creator index are derived state and are rebuilt on import.
message GenesisState {
  // secrets defines all the slim secret records stored at genesis.
  repeated Secret secrets = 1;

  // guardians defines all the guardians registered at genesis.
  repeated Guardian guardians = 2;

  // secret_shares defines the per-guardian encrypted share records.
  repeated StoredShare secret_shares = 3 [(gogoproto.nullable) = false];

  // secret_assignments defines the per-guardian assignment status records.
  repeated StoredAssignment secret_assignments = 4 [(gogoproto.nullable) = false];

  // secret_reveals defines the revealed share records.
  repeated StoredReveal secret_reveals = 5 [(gogoproto.nullable) = false];

  // early_reveal_slashes defines guardians slashed for early reveals on
  // still-live secrets.
  repeated EarlyRevealSlashEntry early_reveal_slashes = 6 [(gogoproto.nullable) = false];

  // secret_payloads defines the stored payload ciphertexts.
  repeated StoredPayload secret_payloads = 7 [(gogoproto.nullable) = false];

  // secret_counter is the monotonic sequence that assigns secret IDs and
  // differentiates selection seeds. It is consensus state and must survive
  // export/import: it only ever climbs, and is deliberately independent of
  // the stored secrets (pruned secrets consumed counter values too — never
  // re-derive it from the secret set).
  uint64 secret_counter = 8;

  // secret_tombstones defines the permanent tombstones of pruned secrets.
  // The prune queue is derived state: it is rebuilt on import from the
  // non-pruned terminal secrets' terminal_at + RetentionBlocks.
  repeated StoredTombstone secret_tombstones = 9 [(gogoproto.nullable) = false];

  // rebate_state is the recipient-rebate accrual state: the allowance
  // available to credit, the height it was last accrued to, and the total
  // credited but not yet collected. Consensus state that must survive
  // export/import — a lost allowance would re-accrue from zero, and a lost
  // reservation would let the pool promise funds twice.
  RebateState rebate_state = 11 [(gogoproto.nullable) = false];

  // guardian_key_histories defines every guardian's append-only key-epoch
  // history. A guardian with no entries here gets epoch 0 synthesised from
  // its record on import (the pre-rotation migration path). The key
  // uniqueness index is derived state — rebuilt on import from the history.
  repeated StoredKeyHistoryEntry guardian_key_histories = 10 [(gogoproto.nullable) = false];
}

// StoredKeyHistoryEntry is a genesis entry for one epoch of one guardian's
// key history.
message StoredKeyHistoryEntry {
  string guardian_address = 1;
  uint64 epoch = 2;
  KeyHistoryEntry entry = 3 [(gogoproto.nullable) = false];
}

// StoredTombstone pairs a pruned secret's id with its permanent tombstone
// for genesis export/import.
message StoredTombstone {
  string secret_id = 1;
  SecretTombstone tombstone = 2 [(gogoproto.nullable) = false];
}

// RebateState carries the recipient-rebate mechanism's accrual bookkeeping.
// See docs/spec.md "Recipient Rebate".
message RebateState {
  // Allowance available to credit, in uveil. Accrues from the rebate pool's
  // balance and is capped at RebateBurstBlocks of accrual.
  int64 allowance = 1;
  // Height the allowance was last accrued to. Accrual is lazy: an idle block
  // does no work, and the gap is applied the next time a settlement consumes
  // the allowance.
  int64 accrued_height = 2;
  // Total credited to secrets but not yet collected, in uveil. Reserved
  // against the pool balance so a credited rebate is always payable.
  int64 reserved = 3;
}
