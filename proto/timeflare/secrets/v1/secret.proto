syntax = "proto3";

package timeflare.secrets.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/timeflareio/chain/x/secrets/types";

// RevealWindow defines the reveal timing configuration for MsgUserRequestGuardians
message RevealWindow {
  // Blocks from current block when reveals can start (relative)
  int64 start_offset = 1;
  // Duration in blocks from start to end
  int64 duration = 2;
}

// DetectionHint is the per-secret recipient discovery hint. It replaces the
// stored recipient public key: the recipient's long-term key never appears
// on chain. The creator derives the hint from a fresh ephemeral keypair and
// the recipient's public key; only the holder of the recipient's PRIVATE key
// can recompute the tag (computational Diffie-Hellman), so secrets are not
// linkable to a recipient — or to each other — by any observer.
// A creator wanting no discovery supplies random bytes: indistinguishable
// from a real hint, so presence reveals nothing (mandatory-field ruling).
message DetectionHint {
  // Hint format version: 1 = single-key X25519 hint. Reserved room for a
  // dual-key (view/spend) scheme without a proto re-cut.
  uint32 version = 1;
  // R — fresh X25519 ephemeral public key, exactly 32 bytes, one per secret
  bytes ephemeral_pub = 2;
  // SHA256("timeflare/detect/v1" || X25519(e, A))[:8] — exactly 8 bytes
  bytes tag = 3;
}

// AssignmentStatus defines the status of a guardian assignment
enum AssignmentStatus {
  // Zero value — never stored; assignment records are always written with an
  // explicit status (PROPOSED at distribution)
  ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  // Assignment has been proposed but not yet responded to
  ASSIGNMENT_STATUS_PROPOSED = 1;
  // Guardian has accepted the assignment
  ASSIGNMENT_STATUS_ACCEPTED = 2;
  // Guardian has rejected the assignment
  ASSIGNMENT_STATUS_REJECTED = 3;
}

// SecretShareData is the COLD per-guardian share record, stored separately
// from the secret keyed (secret_id, guardian_address). Written once at
// UserDistributeShares and immutable thereafter; read one guardian at a time
// (confirm-time existence check, reveal/slash-time HMAC verification).
message SecretShareData {
  // The SSS share data encrypted with the guardian's public key (contains intrinsic SSS ID)
  bytes encrypted_share = 1;
  // HMAC for slashing detection if revealed early
  bytes share_hmac = 2;
}

// AssignmentRecord is the HOT per-guardian assignment status, stored
// separately from the secret keyed (secret_id, guardian_address). Created at
// UserDistributeShares; mutated exactly once, when the guardian responds. Kept
// deliberately tiny so status flips and accepted-set walks never drag share
// bytes through the store.
message AssignmentRecord {
  // Status of this assignment (proposed/accepted/rejected)
  AssignmentStatus status = 1;
  // Block height when guardian responded (if they have)
  int64 responded_at_block = 2;
}

// GuardianAssignment is the assembled per-guardian view (share data + status)
// used by queries and clients. It is not a storage shape: storage splits it
// into SecretShareData (cold) and AssignmentRecord (hot).
message GuardianAssignment {
  // Address of the assigned guardian
  string guardian_address = 1;
  // The SSS share data encrypted with guardian's public key (contains intrinsic SSS ID)
  bytes encrypted_share = 2;
  // HMAC for slashing detection if revealed early
  bytes share_hmac = 3;
  // Status of this assignment (proposed/accepted/rejected)
  AssignmentStatus status = 4;
  // Block height when guardian responded (if they have)
  int64 responded_at_block = 5;
}

// RevealedShare tracks shares that have been revealed by guardians. Stored
// keyed (secret_id, guardian_address); one write per reveal.
message RevealedShare {
  // Address of the guardian who revealed this share
  string guardian_address = 1;
  // The actual decrypted SSS share data (contains intrinsic SSS ID)
  bytes decrypted_share = 2;
  // Block height when this share was revealed
  int64 revealed_at_block = 3;
}

// Secret is the slim per-secret metadata record. The bulky, individually
// accessed data lives in side-stores keyed (secret_id, guardian_address):
// SecretShareData (encrypted shares), AssignmentRecord (assignment status)
// and RevealedShare (reveals). The counters below are denormalised from those
// stores so the hot paths (slot cap, activation, threshold) are O(1) reads;
// invariants assert they never drift.
message Secret {
  // Fields that used to embed the per-guardian data. Retired to side-stores;
  // the numbers stay reserved so old wire data can never be misread.
  reserved 9, 13, 14, 15;
  reserved "guardian_selection", "guardian_assignments", "active_assignments", "revealed_shares";
  // Retired: the buffered total (8) and the pre-buffer requested count (18),
  // replaced by the [min_shares, max_shares] band (27, 28).
  reserved 8, 18;
  reserved "shares", "requested_shares";

  // Protocol-assigned unique identifier: UUIDv5 over chainID ‖ secret_counter
  // (the creator supplies no ID)
  string id = 1;
  // Address of the user who created this secret
  string creator = 2;
  // Recipient discovery hint — see DetectionHint. The recipient's long-term
  // public key is never stored; payload encryption to it happens client-side.
  DetectionHint detection_hint = 3 [(gogoproto.nullable) = false];
  // Block height when guardians can start revealing shares
  int64 reveal_start_block = 5;
  // Block height when reveal window closes
  int64 reveal_end_block = 6;
  // Minimum number of unique shares needed to reconstruct the secret
  int64 threshold = 7;
  // Client-provided SHA256 of the recipient-encrypted payload (C_r) — the
  // reconstruction target — for post-reconstruction verification (Phase 2)
  bytes secret_commitment = 10;
  // Block height when complete 3-phase commit must be finished by
  int64 commit_deadline = 11;
  // Current state: reserved | awaiting_acceptance | pending | reconstructable | revealed | cancelled | failed
  string state = 12;
  // Reward pool for guardians who reveal on time. Derived at publication:
  // P = (max_shares × F_reveal) + (rate × distance × max_shares × bump)
  // (the reveal-transaction gas legs plus the time component). Fixed —
  // unfilled band slots are never refunded; they enlarge the revealers' split.
  cosmos.base.v1beta1.Coin reward_pool = 16 [(gogoproto.nullable) = false];
  // Escrowed reimbursement for the guardians' acceptance transactions, held
  // SEPARATELY from the reward pool: A = max_shares × F_accept, where
  // F_accept is the accept transaction's gas priced at the consensus floor.
  // Distributed at the secret's terminal state to the guardians that did the
  // job asked of them — revealers at settlement, acceptors on a secret that
  // never activated or was cancelled — with any slice whose work never
  // happened refunded to the creator. Frozen at publication like the pool, so
  // every terminal-state payout derives from stored economics and a later gas
  // retune can never re-price a live secret.
  cosmos.base.v1beta1.Coin accept_fees = 29 [(gogoproto.nullable) = false];
  // Block height when this secret was created
  int64 created_at = 17;
  // Creator's security factor in hundredths (100 = 1.00). Sizes both the
  // reward pool and each guardian's bond (B = bond_unit × bump).
  int64 bump = 19;
  // Retired: the single flat per-guardian bond. Bonds are now frozen
  // per-guardian at selection (guardian_bond_amounts below) — the number
  // stays reserved so old wire data can never be misread.
  reserved 20;
  reserved "bond_amount";
  // Guardian addresses selected in Phase 1 (max_shares entries). Written once
  // at publication; UserDistributeShares validates share addressing against it
  // without touching the side-stores.
  repeated string selected_guardians = 21;
  // Number of assignments with status ACCEPTED (denormalised; the accepted
  // set itself lives in the AssignmentRecord store). Accumulates up to
  // max_shares; at deadline finalisation the accepted set IS the active set.
  //
  // ⚠️ NOT stored in this record. SetSecret zeroes this field in the stored
  // blob and writes the tally to its own key (SecretAcceptedCounts), so an
  // acceptance writes ~10 bytes instead of rewriting a roster carrying one
  // address and one frozen bond per selected guardian; GetSecret joins it
  // back, so ordinary callers never notice. Anything decoding the Secrets
  // store DIRECTLY — an indexer, a migration, a keeper method that bypasses
  // GetSecret — reads 0, and for TerminalSecretRecord that yields a canonical
  // digest which will not match the secret's tombstone.
  int64 accepted_count = 22;
  // Number of shares revealed so far (denormalised from the RevealedShare store)
  int64 revealed_count = 23;
  // Block height at which the secret reached a terminal state
  // (revealed/cancelled/failed); 0 while non-terminal. Drives retention.
  int64 terminal_at = 24;
  // pk_s — the per-secret public key (32B), set at share distribution. A
  // reconstructed per-secret private key can be checked against it: a match
  // with a failing payload decrypt or commitment is provable creator fault.
  bytes secret_public_key = 25;
  // Per-guardian bond amounts in uveil, aligned index-for-index with
  // selected_guardians. Frozen at selection from each guardian's own live k
  // (B_g = rate × distance × bump × k_g); acceptance locks and settlement
  // releases/slashes these stored amounts verbatim — a guardian's k moving
  // after selection never re-prices an existing selection (Position A).
  repeated int64 guardian_bond_amounts = 26;
  // Band floor: minimum acceptances by commit_deadline for the secret to
  // activate (threshold ≤ min_shares)
  int64 min_shares = 27;
  // Band ceiling: guardians selected and SSS shares generated
  // (min_shares ≤ max_shares ≤ 32, max_shares − min_shares < threshold)
  int64 max_shares = 28;
  // Rebate credited to this secret's recipient at settlement, in uveil, and
  // reserved in the keyless rebate pool until collected. Zero means no rebate:
  // the secret did not reach `revealed`, or its share fell below the dust
  // floor. Set once at settlement and never re-priced — collecting late pays
  // exactly what collecting immediately would. See docs/spec.md
  // "Recipient Rebate".
  int64 rebate_amount = 30;
  // True once MsgRecipientCollectRebate has paid rebate_amount out. The pair
  // is the whole rebate state: a positive amount that is not yet collected is
  // the only collectable condition.
  bool rebate_collected = 31;
}

// RebateCommitmentRecord is one collector's commitment to a recipiency proof:
// the hash binding the proof to their address, and the height it was recorded
// at. Step 2 of collection requires both — a matching commitment, recorded in
// an EARLIER block — which is what stops an observer front-running a proof that
// is public the moment it is revealed. See docs/spec.md "Recipient Rebate".
message RebateCommitmentRecord {
  // SHA256("timeflare/rebate-commit/v1" || z || collector address bytes)
  bytes commitment = 1;
  // Height the commitment was recorded at; the reveal must land strictly later
  int64 committed_at = 2;
}

// SecretTombstone is the compact, permanent record left behind when a
// terminal secret is pruned at terminal_at + RetentionBlocks. It is the
// decided seven-field model (docs/planning/PENDING_TERMINAL_SECRET_RETENTION_PLAN.md §4):
// a verification anchor (the digest makes any archived copy of the full
// canonical record self-authenticating), identity for standalone attribution,
// and the one cryptographic anchor that enables archive-free verification of
// a reconstructed payload. Everything else about the secret is provable via
// record_digest plus an archived TerminalSecretRecord.
message SecretTombstone {
  // SHA256 of the deterministically marshalled TerminalSecretRecord
  bytes record_digest = 1;
  // Final lifecycle state: revealed | failed | cancelled
  string final_state = 2;
  // Height of the terminal transition
  int64 terminal_at = 3;
  // Height Stage 2 pruning executed — locates the archival event that
  // carries the full canonical record
  int64 pruned_at = 4;
  // Creator address — attribution without an archive
  string creator = 5;
  // Creation height: lifetime = terminal_at − created_at; also locates the
  // distribution transaction (where the payload ciphertext lives) in block
  // history
  int64 created_at = 6;
  // SHA256(C_r) — the secret commitment, letting anyone verify an archived
  // or reconstructed recipient-encrypted payload directly, no record needed
  bytes secret_commitment = 7;
}

// TerminalSecretRecord is the canonical final record of a pruned secret —
// the preimage of SecretTombstone.record_digest. Marshalling is
// deterministic (no map fields; reveals sorted by guardian address,
// byte-wise ascending) and pinned by a golden test: an encoder change must
// never silently re-digest history.
message TerminalSecretRecord {
  // The slim secret record exactly as last stored
  Secret secret = 1 [(gogoproto.nullable) = false];
  // Reveal records sorted by guardian address (bech32 string, byte-wise
  // ascending) — never store iteration order, even though those coincide
  repeated RevealedShare reveals = 2 [(gogoproto.nullable) = false];
  // SHA256 of the stored payload ciphertext C, hashed at prune time — makes
  // any archived copy of C self-authenticating after Stage 2 deletes it
  bytes payload_digest = 3;
}
